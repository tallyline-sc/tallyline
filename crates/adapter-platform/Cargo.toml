[package]
name = "tallyline-adapter-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tallyline-shared-kernel.workspace = true
zeroize.workspace = true
tallyline-submission.workspace = true
tallyline-workflows = { path = "../workflows" }
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "=0.6.5", default-features = false }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store.workspace = true
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.x86_64-pc-windows-msvc.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
static_mut_refs = "deny"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

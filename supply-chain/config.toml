[[exemptions.system-configuration]]
version = "0.7.0"
criteria = "safe-to-deploy"
notes = "S-6 justified off-target exemption, not a full soundness audit: absent from both supported workspace-root graphs x86_64-pc-windows-msvc and x86_64-unknown-linux-gnu. Native-scope must reject any reachable version, including renamed edges, before builds. Complete selected dynamic_store.rs and lib.rs read: callback_context accepts arbitrary T without a static lifetime while build returns non-generic SCDynamicStore, erasing T into a C callback pointer; do not activate this callback API or claim unrestricted soundness. Hyper-util0.1.21's macOS proxy consumer uses callback=None, but no Apple target is approved. Other source modules are not certified by this exemption. Revisit2027-04-13 or before any activation."

[[exemptions.system-configuration-sys]]

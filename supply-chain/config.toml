criteria = "safe-to-deploy"
notes = "S-6 justified off-target exemption, not a fresh full FFI audit: absent from both supported workspace-root graphs x86_64-pc-windows-msvc and x86_64-unknown-linux-gnu. Native-scope must reject any reachable version, including renamed edges, before builds. Complete build.rs and src/lib.rs read; build script only emits framework=SystemConfiguration when TARGET contains -apple, with no source compilation, download or process execution. Raw Apple SystemConfiguration/CoreFoundation declarations are not approved for activation. Revisit2027-04-13 or before any activation."


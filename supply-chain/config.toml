[[exemptions.send_wrapper]]
version = "0.6.0"
criteria = "safe-to-deploy"
notes = "S-6 exact off-target exemption only, not a source-soundness audit: package is absent from both supported target graphs x86_64-pc-windows-msvc and x86_64-unknown-linux-gnu. Complete src/lib.rs and src/futures.rs inspection identified an unresolved optional Future/Stream Pin projection and wrong-thread Drop/leak contract concern; no unrestricted audit or publisher trust is granted. Current full graph enables no optional features. Native-scope rejects every reachable send_wrapper version from every workspace root, including renamed transitive edges, with or without the futures feature. Revisit 2027-04-13 or before any target, feature, version or activation change; activation needs a focussed source review and explicit owner approval."


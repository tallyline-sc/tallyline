[[exemptions.android-properties]]
version = "0.2.2"
criteria = "safe-to-deploy"
notes = "S-6 justified off-target exemption, not a source-soundness audit: absent from both shipped-target graphs x86_64-pc-windows-msvc and x86_64-unknown-linux-gnu, and native-scope rejects any reachable version including renamed edges. Complete source inspection found unsafe Android bionic-deprecated empty-CString 92-byte output buffer/reconstruction defects and Rust-ABI callback declarations; do not activate Android or conceal these defects. Final filtered metadata and native-scope passed 2026-11-01. Separate suppression register revisit 2027-04-13 or before any activation."


[[audits.wayland-cursor]]
who = "GPT-6.1 Sol (AI source review)"
criteria = "safe-to-deploy"
version = "0.31.14"
notes = "AI full source review by GPT-6.1 Sol: read complete sole src/lib.rs and both manifests of0.31.14. Reviewed local XCURSOR_THEME/SIZE/theme/fallback reads, image/animation selection, append-only shm storage, Wayland buffer creation, weak backend/FD ownership and ignored object callbacks. No own unsafe/build/native compilation/process launch or Internet access; caller existing Wayland connection and local cursor assets only. Linux memfd uses CLOEXEC; POSIX shm fallback uses CREATE|EXCL and0600 then immediate unlink. Limits: malformed/empty/zero-delay images, extreme dimensions/pool sizes and truncation can panic or make invalid compositor requests; assessment requires ordinary trusted desktop themes, reasonable sizes and valid compositor contracts. POSIX fallback retries a fixed time-derived name and may spin if precreated; shipped Linux normally uses memfd. Reasonable desktop deployment assessment, not an untrusted-image service/parser or no-panic proof. Dependencies remain separate obligations. Archive4a52d18780be9b1314328a3de5f930b73d2200112e3849ca6cb11822793fb34d matches Cargo.lock. AI-reviewed; owner reviews record in pull request."


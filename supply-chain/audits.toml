notes = "AI source review: read all five production Rust files, complete example, README, both manifests and MIT text. Archive 71704c03f739f7745053bde45fa203a46c58d25bc5c4efba1d9a60e9dba81226 matches lock and all17 archive files match cache. Reviewed worker ownership/Exit join, seat focus and serial selection, MIME filtering, clipboard/primary selection, nonblocking FD reads/writes, UTF8 conversion and CRLF normalisation. Unsafe constructor explicitly requires caller-owned valid wl_display for the entire Clipboard lifetime; worker is joined before that lifetime ends. calloop unsafe get_mut only reads/writes the retained pipe, never replaces/drops its registered I/O source. fcntl uses a live owned FD and checks errors. No build/native compilation/process/network/telemetry or unrelated file access; clipboard transfer over supplied Wayland connection and OS pipes is its intended capability. Local compositor and clipboard peers can cause unbounded memory use or latency with huge/nonterminating transfers; this does not certify a sandbox for hostile clipboard streams. Some backend/protocol/registration failures can panic or prevent replies; ordinary focused GUI use and dependency contracts assumed. Example prints clipboard/keyboard data and is not shipped application behaviour. No blanket publisher trust or full dependency audit is implied. AI review, not completed human review."

